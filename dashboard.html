<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智学平台 · 我的看板</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <style>
    :root {
      --bg: #F4ECD8; --card: #FFFFFF; --text: #2E2A3B; --line: #2E2A3B;
      --muted: #6B6478; --pink: #FF5D8F; --blue: #4D7CFE; --yellow: #FFC83D;
      --green: #4FC46A; --shadow: #2E2A3B; --teal:#2DD4BF; --orange:#FF8A3D; --purple:#9B6BF2;
    }
    body.dark { --bg:#1A1726; --card:#2E2A3B; --text:#F4ECD8; --line:#F4ECD8; --muted:#B4B2A9; --shadow:#000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family:"Noto Sans SC",system-ui,sans-serif; font-size:15px; line-height:1.6; transition: background .25s, color .25s; }
    .pixel { font-family:"Press Start 2P", monospace; }
    .app { display:flex; min-height:100vh; }
    .sidebar { width:220px; flex-shrink:0; border-right:3px solid var(--line); padding:24px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
      /* 侧栏项超过一屏时（工具区注入后共 11 项）内部滚动，避免底部按钮被裁掉 */
      overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .sidebar::-webkit-scrollbar { width:8px; }
    .sidebar::-webkit-scrollbar-track { background:transparent; }
    .sidebar::-webkit-scrollbar-thumb { background:var(--line); border:2px solid var(--bg); }
    .sidebar .nav { flex-shrink:0; }
    .logo { font-family:"Press Start 2P",monospace; font-size:13px; line-height:1.7; border:3px solid var(--line); background:var(--yellow); color:#2E2A3B; padding:10px 12px; box-shadow:4px 4px 0 var(--shadow); margin-bottom:28px; }
    .nav { display:flex; flex-direction:column; gap:6px; }
    .nav a { display:flex; align-items:center; gap:10px; padding:11px 12px; color:var(--text); text-decoration:none; border:3px solid transparent; font-weight:500; transition:transform .12s, background .12s, border-color .12s; }
    .nav a .dot { width:12px; height:12px; background:var(--blue); border:2px solid var(--line); flex-shrink:0; }
    .nav a:hover { transform:translate(-2px,-2px); border-color:var(--line); box-shadow:3px 3px 0 var(--shadow); background:var(--card); }
    .nav a.active { background:var(--pink); color:#fff; border-color:var(--line); box-shadow:4px 4px 0 var(--shadow); }
    .nav a.active .dot { background:#fff; }
    /* 工具区（由 polish.js featureNav 注入：错题本 / 作业 / 排行榜 / 设置） */
    .nav-sep { font-family:"Press Start 2P",monospace; font-size:8px; color:var(--muted); margin:16px 0 6px; padding-left:12px; letter-spacing:1px; }
    .nav a.tool .dot { background:var(--teal); }
    .nav a.tool:hover { background:var(--teal); color:#04201f; }
    .sidebar-foot { margin-top:auto; display:flex; justify-content:center; padding-top:20px; }
    .main { flex:1; min-width:0; padding:24px 32px 48px; }
    .topbar { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
    .search { flex:1; display:flex; align-items:center; gap:10px; border:3px solid var(--line); background:var(--card); padding:10px 14px; box-shadow:4px 4px 0 var(--shadow); }
    .search input { flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:15px; color:var(--text); }
    .search .mag { width:14px; height:14px; border:3px solid var(--line); border-radius:50%; position:relative; }
    .search .mag::after { content:""; position:absolute; width:8px; height:3px; background:var(--line); bottom:-6px; right:-5px; transform:rotate(45deg); }
    .icon-btn { width:46px; height:46px; flex-shrink:0; border:3px solid var(--line); background:var(--card); box-shadow:4px 4px 0 var(--shadow); cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:transform .12s; }
    .icon-btn:hover { transform:translate(-2px,-2px); }
    .hero { border:3px solid var(--line); background:var(--card); box-shadow:6px 6px 0 var(--shadow); padding:26px; display:flex; gap:28px; align-items:center; margin-bottom:30px; }
    .hero .avatar-big { width:120px; height:120px; flex-shrink:0; border:3px solid var(--line); background:var(--green); box-shadow:4px 4px 0 var(--shadow); display:flex; align-items:center; justify-content:center; font-family:"Press Start 2P"; font-size:34px; color:#2E2A3B; }
    .hero h1 { font-size:22px; margin-bottom:8px; }
    .hero p { color:var(--muted); margin-bottom:14px; }
    .btn { display:inline-block; font-family:"Press Start 2P"; font-size:11px; background:var(--pink); color:#fff; border:3px solid var(--line); padding:12px 18px; box-shadow:4px 4px 0 var(--shadow); cursor:pointer; text-decoration:none; transition:transform .12s; }
    .btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--shadow); }
    .sec-head { display:flex; align-items:flex-end; justify-content:space-between; margin:8px 0 18px; }
    .sec-head h2 { font-size:18px; }
    .sec-head .pixel { font-size:10px; color:var(--muted); }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:18px; margin-bottom:30px; }
    .kpi { border:3px solid var(--line); background:var(--card); box-shadow:4px 4px 0 var(--shadow); padding:18px; }
    .kpi .label { font-size:12px; color:var(--muted); margin-bottom:8px; }
    .kpi .val { font-family:"Press Start 2P"; font-size:22px; }
    .kpi .val.pink { color:var(--pink); } .kpi .val.blue { color:var(--blue); } .kpi .val.green { color:var(--green); } .kpi .val.yellow { color:#D9A400; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .panel { border:3px solid var(--line); background:var(--card); box-shadow:4px 4px 0 var(--shadow); padding:20px; }
    .panel h3 { font-size:15px; margin-bottom:16px; }
    .weak-row { margin-bottom:14px; }
    .weak-row .top { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
    .weak-bar { height:14px; border:3px solid var(--line); background:var(--bg); }
    .weak-bar > i { display:block; height:100%; }
    .trend-svg { width:100%; height:160px; display:block; }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px; }
    .card { border:3px solid var(--line); background:var(--card); box-shadow:4px 4px 0 var(--shadow); padding:18px; transition:transform .14s, box-shadow .14s; }
    .card:hover { transform:translate(-3px,-3px); box-shadow:7px 7px 0 var(--shadow); }
    .card h3 { font-size:16px; margin-bottom:6px; }
    .card .desc { color:var(--muted); font-size:12px; line-height:1.5; margin-bottom:14px; }
    .card .go { font-family:"Press Start 2P"; font-size:9px; background:var(--blue); color:#fff; border:3px solid var(--line); padding:8px 10px; cursor:pointer; box-shadow:3px 3px 0 var(--shadow); display:inline-block; text-decoration:none; }
    .card .go:hover { transform:translate(-2px,-2px); }
    .tag { display:inline-block; font-family:"Press Start 2P"; font-size:8px; background:var(--yellow); color:#2E2A3B; padding:5px 7px; border:2px solid var(--line); margin-bottom:10px; }
    footer { margin-top:40px; color:var(--muted); font-size:13px; text-align:center; }
    .loading { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
    @media (max-width:860px){ .cols{ grid-template-columns:1fr; } .sidebar{ display:none; } .main{ padding:18px; } .hero{ flex-direction:column; text-align:center; } }
  </style>
  <link rel="stylesheet" href="assets/polish.css" />
  <link rel="stylesheet" href="assets/classroom-rules.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">智学<br/>PLATFORM</div>
      <nav class="nav">
        <a href="index.html"><span class="dot"></span>学习主页</a>
        <a href="dashboard.html" class="active"><span class="dot"></span>我的看板</a>
        <a href="reading.html"><span class="dot"></span>阅读单元</a>
        <a href="writing.html"><span class="dot"></span>写作单元</a>
        <a href="grammar.html"><span class="dot"></span>语法单元</a>
      </nav>
      <div class="sidebar-foot">
        <svg viewBox="0 0 40 40" width="48" height="48" aria-hidden="true">
          <rect x="6" y="8" width="4" height="24" fill="#6B5235"/>
          <rect x="8" y="6" width="24" height="28" fill="#A0826D"/>
          <rect x="8" y="30" width="24" height="4" fill="#D4C5A8"/>
          <rect x="14" y="12" width="14" height="2" fill="#D4C5A8"/>
          <rect x="14" y="17" width="10" height="2" fill="#D4C5A8"/>
          <rect x="14" y="22" width="12" height="2" fill="#D4C5A8"/>
        </svg>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="search"><span class="mag"></span><input type="text" placeholder="搜索单元 / 题目 / 知识点" /></div>
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <span id="authChip"></span>
      </div>

      <div id="content"><div class="loading">正在加载你的学习数据…</div></div>

      <footer>智学平台 · 混合架构 v0.5 · 学生进度看板（数据由 Node 后端持久化）</footer>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script src="assets/classroom-rules.js"></script>
  <script>
    const WEAK = { tfng:'T/F/NG 判断', pronoun:'代词指代', attitude:'态度词推断', wordform:'词形转换', conjunction:'连词语序', intransitive:'不及物陷阱' };
    const WEAK_COLOR = { tfng:'#FF5D8F', pronoun:'#4D7CFE', attitude:'#FFC83D', wordform:'#4FC46A', conjunction:'#2DD4BF', intransitive:'#9B6BF2' };

    // 主题
    const tbtn = document.getElementById('themeBtn');
    if (localStorage.getItem('zhixue-theme') === 'dark') { document.body.classList.add('dark'); tbtn.textContent='☀️'; }
    tbtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const d = document.body.classList.contains('dark');
      tbtn.textContent = d ? '☀️':'🌙';
      localStorage.setItem('zhixue-theme', d?'dark':'light');
    });

    ZhiXue.initAuthChip();

    ZhiXue.ensureLogin().then(async (u) => {
      if (u.role === 'teacher') { window.location.href = 'teacher.html'; return; }
      const p = await ZhiXue.loadProgress();
      if (!p) { document.getElementById('content').innerHTML = '<div class="loading">未找到学习数据</div>'; return; }
      render(p, u);
    }).catch(() => {});

    function render(p, u) {
      const acc = p.stats.total ? Math.round(p.stats.correct / p.stats.total * 100) : 0;
      // 14 天趋势
      const byDate = {};
      p.history.forEach(h => { if(!byDate[h.date]) byDate[h.date] = {s:0,n:0}; byDate[h.date].s += h.score; byDate[h.date].n += 1; });
      const days = [];
      const today = new Date();
      for (let i=13;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); const k=d.toISOString().slice(0,10); days.push({date:k, v: byDate[k] ? Math.round(byDate[k].s/byDate[k].n) : null}); }

      // 薄弱点排序
      const weakArr = Object.keys(p.weakPoints).map(k => ({key:k, label:WEAK[k], v:p.weakPoints[k]})).sort((a,b)=>a.v-b.v);
      const weakest = weakArr[0];

      // 推荐映射
      const REC = {
        tfng:{t:'Reading · T/F/NG 专项', d:'强化 True/False/Not Given 判断逻辑，配套篇章精读。', h:'reading.html', c:'var(--pink)'},
        pronoun:{t:'Reading · 代词指代', d:'定位指代对象，厘清长难句结构。', h:'reading.html', c:'var(--blue)'},
        attitude:{t:'Reading · 态度词推断', d:'识别作者语气与态度词，提升推断题命中率。', h:'reading.html', c:'var(--yellow)'},
        wordform:{t:'Grammar · 词形转换', d:'系统训练 Oxford 词形转换，覆盖名词/动词/形容词派生。', h:'grammar.html', c:'var(--green)'},
        conjunction:{t:'Grammar · 连词语序', d:'掌握并列/从属连词的位置与逻辑衔接。', h:'grammar.html', c:'var(--teal)'},
        intransitive:{t:'Grammar · 不及物陷阱', d:'区分及物/不及物，避免常见搭配错误。', h:'grammar.html', c:'var(--purple)'},
      };
      const rec = REC[weakest.key];

      const initial = (u.name||u.username||'?').slice(0,1);
      document.getElementById('content').innerHTML = `
        <section class="hero">
          <div class="avatar-big">${initial}</div>
          <div>
            <h1>你好，${u.name} 👋</h1>
            <p>这是你的学习快照。进度已实时保存到后端，刷新或换设备登录都不会丢失。</p>
            <a class="btn" href="reading.html" data-enter="reading.html">继续学习 →</a>
          </div>
          <div style="margin-left:auto;text-align:center">
            ${ring(acc)}
            <div style="font-family:'Press Start 2P';font-size:9px;color:var(--muted);margin-top:8px">总正确率</div>
          </div>
        </section>

        <div class="kpis">
          <div class="kpi"><div class="label">总正确率</div><div class="val pink">${acc}%</div></div>
          <div class="kpi"><div class="label">当前连胜 🔥</div><div class="val yellow">${p.stats.streak}</div></div>
          <div class="kpi"><div class="label">最长连胜</div><div class="val green">${p.stats.maxStreak}</div></div>
          <div class="kpi"><div class="label">已完成单元</div><div class="val blue">${p.stats.completedUnits.length}</div></div>
        </div>

        <div class="cols" style="margin-bottom:30px">
          <div class="panel">
            <h3>📉 薄弱知识点（越低越需加强）</h3>
            ${weakArr.map(w => `
              <div class="weak-row">
                <div class="top"><span>${w.label}</span><span style="font-family:'Press Start 2P';font-size:9px">${w.v}</span></div>
                <div class="weak-bar"><i style="width:${w.v}%;background:${WEAK_COLOR[w.key]}"></i></div>
              </div>`).join('')}
          </div>
          <div class="panel">
            <h3>📈 近 14 天答题趋势</h3>
            ${trendSvg(days)}
          </div>
        </div>

        <div class="sec-head"><h2>🎯 推荐下一步</h2><span class="pixel">BASED ON WEAKEST</span></div>
        <section class="grid2">
          <div class="card" style="border-color:${rec.c}">
            <span class="tag" style="background:${rec.c}">最薄弱 · ${weakest.label}</span>
            <h3>${rec.t}</h3>
            <div class="desc">${rec.d}</div>
            <a class="go" href="${rec.h}" data-enter="${rec.h}">去练习 →</a>
          </div>
          <div class="card">
            <span class="tag" style="background:var(--green)">冲刺</span>
            <h3>Grammar · 短期冲刺课</h3>
            <div class="desc">710 句翻译 + 自动计分闯关，适合考前集中突破。</div>
            <a class="go" href="courseware/grammar/sprint.html" data-enter="courseware/grammar/sprint.html">打开冲刺 →</a>
          </div>
        </section>
      `;

      document.querySelectorAll('[data-enter]').forEach(a => a.addEventListener('click', e => {
        e.preventDefault();
        ZhiXue.ensureLogin().then(()=> window.location.href = a.dataset.enter).catch(()=>{});
      }));
      ZhiXue.initAuthChip();
    }

    function ring(pct) {
      const r = 34, c = 2*Math.PI*r;
      const off = c * (1 - pct/100);
      return `<svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
        <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--green)" stroke-width="8"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 46 46)"/>
        <text x="46" y="52" text-anchor="middle" font-family="Press Start 2P" font-size="13" fill="var(--text)">${pct}%</text>
      </svg>`;
    }

    function trendSvg(days) {
      const w = 320, h = 150, pad = 18;
      const max = 100, n = days.length;
      const bw = (w - pad*2) / n;
      const bars = days.map((d, i) => {
        const x = pad + i*bw;
        const bh = d.v==null ? 0 : (d.v/max)*(h-pad*2);
        const y = h - pad - bh;
        const col = d.v==null ? 'transparent' : (d.v>=70?'var(--green)':d.v>=50?'var(--yellow)':'var(--pink)');
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}" stroke="var(--line)" stroke-width="2"/>`;
      }).join('');
      const base = `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="2"/>`;
      return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${base}${bars}</svg>`;
    }
  </script>
  <script src="assets/polish.js"></script>
</body>
</html>
