<html lang="zh-CN">

    a{font-family:"Press Start 2P";font-size:9px;background:var(--blue);color:#fff;border:3px solid var(--line);padding:10px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--shadow);display:inline-block;}
