<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Unit 1 · 词形转换</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    :root{--bg:#F4ECD8;--card:#FFF;--text:#2E2A3B;--line:#2E2A3B;--muted:#6B6478;--green:#4FC46A;--shadow:#2E2A3B;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC",system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;}
    .box{border:3px solid var(--line);background:var(--card);box-shadow:6px 6px 0 var(--shadow);padding:40px;max-width:540px;text-align:center;}
    .tag{font-family:"Press Start 2P";font-size:9px;background:var(--green);color:#2E2A3B;padding:6px 8px;border:2px solid var(--line);display:inline-block;margin-bottom:16px;}
    h1{font-size:20px;margin:0 0 12px;}
    p{color:var(--muted);line-height:1.7;margin:0 0 20px;}
    a{font-family:"Press Start 2P";font-size:9px;background:var(--green);color:#2E2A3B;border:3px solid var(--line);padding:10px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--shadow);display:inline-block;}
    a:hover{transform:translate(-2px,-2px);}
  </style>
</head>
<body>
  <div class="box">
    <span class="tag">GRAMMAR · UNIT 1</span>
    <h1>本单元课件制作中</h1>
    <p>主题：<b>词形转换 Word Formation</b><br/>名词 ↔ 动词 ↔ 形容词 ↔ 副词相互转化：常见后缀（-tion / -ment / -able / -ly）、易错拼写与上下文判断。<br/><br/>完整的 Oxford Success in Grammar 交互课件将在此接入，与 Reading / Writing 单元库保持一致。你可以把做好的课件替换本文件（路径 <code>courseware/grammar/unit1.html</code>）。</p>
    <a href="../grammar.html">← 返回 Grammar 单元库</a>
  </div>
</body>
</html>
