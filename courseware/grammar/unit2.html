    :root{--bg:#F4ECD8;--card:#FFF;--text:#2E2A3B;--line:#2E2A3B;--muted:#6B6478;--yellow:#FFC83D;--shadow:#2E2A3B;}

    p{color:var(--muted);line-height:1.7;margin:0 0 20px;}
    a{font-family:"Press Start 2P";font-size:9px;background:var(--yellow);color:#2E2A3B;border:3px solid var(--line);padding:10px 12px;text-decoration:none;box-shadow:3px 3px 0 var(--shadow);display:inline-block;}
